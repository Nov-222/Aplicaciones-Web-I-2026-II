<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio - Ingeniería de Software</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Encabezado principal -->
  <header class="header">
    <div class="container">
      <h1 class="title">Ingeniería de Software</h1>
      <p class="description">
        Disciplina enfocada en el diseño, desarrollo, prueba y mantenimiento de sistemas de software eficientes, escalables y seguros. Aplicación de principios de ingeniería al ciclo de vida del código para resolver problemas complejos mediante tecnología.
      </p>
    </div>
  </header>

  <!-- Sección de proyectos -->
  <main class="main-content container">
    <section class="projects-section">
      <h2>Proyectos</h2>
      
      <div class="projects-grid">
        <!-- Tarjeta de Proyecto -->
        <article class="project-card">
          <div class="image-wrapper">
            <img src="https://picsum.photos/600/400" alt="Vista previa del Proyecto 1">
            <div class="overlay">
              <h3 class="project-title">Proyecto 1</h3>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
